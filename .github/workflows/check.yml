name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The daily relock dispatches it on its relock/<date> branch: a pull
  # request opened with GITHUB_TOKEN starts no workflow by itself
  workflow_dispatch:

jobs:
  check:
    uses: bats-lang/repository-prototype/.github/workflows/package-check.yml@47d1f0e392a70da58c819ec532e9df734edd3bd7 # repository-prototype main 47d1f0e
